services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REPO_ROOT=/repo
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - AIRFLOW_BASE_URL=http://host.docker.internal:8080/api/v1
    volumes:
      - ..:/repo:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - PYTHONFAULTHANDLER=1
    depends_on:
      - backend
